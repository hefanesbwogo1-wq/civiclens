<!-- REPLACE YOUR MAIN CONTENT AREA WITH THIS -->
<div style="padding:24px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px">
    <div style="position:relative">
      <input id="search-leaders" type="text" placeholder="Search leaders..." style="width:280px;padding:10px 12px 10px 36px;border:1px solid #e2e8f0;border-radius:10px;font-size:13px;outline:none" />
      <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94a3b8">◉</span>
    </div>
    <div style="display:flex;gap:10px">
      <button id="refresh-leaders" style="padding:10px 14px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;font-weight:700;font-size:12px;cursor:pointer">↻ Refresh</button>
      <button id="add-leader-btn" style="padding:10px 16px;background:#1769e0;color:#fff;border:0;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer">+ Add Leader</button>
    </div>
  </div>

  <!-- THIS IS THE CONTAINER YOUR JS WAS MISSING - THIS FIXES LINE 450 -->
  <div id="leaders-container" class="leaders-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px">
    <div style="grid-column:1/-1;text-align:center;padding:60px;color:#94a3b8">
      <div style="width:32px;height:32px;margin:0 auto 12px;border:3px solid #e7edf5;border-top-color:#1769e0;border-radius:50%;animation:spin .8s linear infinite"></div>
      Loading leaders...
    </div>
  </div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
