<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaders | CivicLens</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/static/js/config.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Inter,system-ui,sans-serif;background:#f6f8fb;display:flex;min-height:100vh}
    .sidebar{width:240px;background:#0f1e3a;color:#8fa0bf;display:flex;flex-direction:column;padding:18px 12px;position:fixed;height:100vh;left:0;top:0}
    .sidebar-brand{display:flex;align-items:center;gap:10px;padding:10px 8px;margin-bottom:20px}
    .brand-icon{width:34px;height:34px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#0f1e3a;font-weight:900}
    .brand-text{color:#fff;font-weight:800;font-size:15px} .brand-text span{display:block;font-size:9px;color:#7c8db0}
    .nav-item{display:flex;gap:10px;padding:11px 12px;border-radius:10px;color:#8fa0bf;text-decoration:none;font-size:13px;margin-bottom:4px}
    .nav-item.active{background:#1a2e5a;color:#fff}
    .main{margin-left:240px;flex:1}
    .topbar{background:#fff;border-bottom:1px solid #e6eaf0;padding:16px 28px;display:flex;justify-content:space-between;align-items:center}
    .content{padding:24px 28px}
    .toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:20px}
    .search-box input{width:280px;padding:10px 12px 10px 36px;border:1px solid #e2e8f0;border-radius:10px;font-size:13px}
    .btn{padding:10px 16px;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer;border:0}
    .btn-primary{background:#1769e0;color:#fff} .btn-secondary{background:#fff;border:1px solid #e2e8f0}
    .leaders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-brand"><div class="brand-icon">CL</div><div class="brand-text">CivicLens <span>POLITICAL INTELLIGENCE</span></div></div>
    <a href="/dashboard" class="nav-item">Dashboard</a>
    <a href="/mentions" class="nav-item">Mentions</a>
    <a href="/leaders" class="nav-item active">Leaders</a>
    <a href="/settings" class="nav-item">Settings</a>
  </aside>
  <div class="main">
    <div class="topbar"><div><h1 style="font-size:20px;color:#10223b;font-weight:800">Leaders</h1><p style="font-size:11px;color:#7b8797">Manage leaders and monitoring</p></div></div>
    <div class="content">
      <div class="toolbar">
        <div class="search-box"><input id="search-leaders" type="text" placeholder="Search leaders..." /></div>
        <div style="display:flex;gap:10px"><button id="refresh-leaders" class="btn btn-secondary">Refresh</button><button id="add-leader-btn" class="btn btn-primary">+ Add Leader</button></div>
      </div>
      <!-- FIX: THIS DIV WAS MISSING - NOW IT EXISTS -->
      <div id="leaders-container" class="leaders-grid" style="min-height:200px">
        <div style="grid-column:1/-1;text-align:center;padding:60px;color:#94a3b8">Loading leaders...</div>
      </div>
    </div>
  </div>
  <div id="add-leader-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center"><div style="background:#fff;width:90%;max-width:440px;border-radius:16px;padding:20px"><h3 style="margin-bottom:12px">Add Leader</h3><form id="add-leader-form" style="display:flex;flex-direction:column;gap:10px"><input id="leader-name" required placeholder="Full name" style="padding:10px;border:1px solid #e2e8f0;border-radius:8px"/><input id="leader-position" placeholder="Position" style="padding:10px;border:1px solid #e2e8f0;border-radius:8px"/><input id="leader-org" placeholder="Organization" style="padding:10px;border:1px solid #e2e8f0;border-radius:8px"/><div style="display:flex;gap:10px"><button type="button" id="close-modal" style="flex:1;padding:10px">Cancel</button><button type="submit" style="flex:1;padding:10px;background:#1769e0;color:#fff;border:0;border-radius:8px">Add</button></div></form></div></div>
  <script src="/static/js/leaders.js?v=5"></script>
</body>
</html>
