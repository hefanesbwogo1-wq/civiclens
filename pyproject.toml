[project]
name = "civiclens"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-dotenv",
  "supabase",
  "pydantic",
  "httpx",
  "python-multipart",
  "python-jose[cryptography]",
  "passlib[bcrypt]"
]

[tool.vercel]
entrypoint = "api/index.py"
